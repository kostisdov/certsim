[project]
name = "certsim"
version = "1.0.0"
description = "Certified bounds for physics simulations"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Konstantinos Dovelos", email = "kostisdovelos@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "python-flint>=0.9.0",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
viz = [
    "matplotlib>=3.11.2",
    "rerun-sdk==0.37.2",
]
